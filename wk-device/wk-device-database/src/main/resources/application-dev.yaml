wk:
  dao:
    interceptor:
      log:
        enabled: true
      time:
        enabled: true
    sqls:
      path: sqls/
    druid-web:
      enabled: true
      username: admin
      password: admin
  database:
    enabled: true
    snowflake: true
    table:
      create: true
      migration: true
      add: true
      delete: false
      check: false
      package:
        - com.budwk.sp
  device:
    message:
      enabled: true
      provider: REDIS
      topic-prefix: wk.device
      send-timeout: 3000
    database-ext:
      raw-archive-topic: wk.device.uplink.raw.archive
      # server 侧查询与 database 侧写入必须保持一致：
      # DEFAULT  使用默认关系库（当前主数据源，如 PostgreSQL / MySQL）
      # MONGODB  使用 MongoDB 文档存储
      # TDENGINE 使用 TDengine 时序库存储
      # raw     原始通信报文，可选 DEFAULT / MONGODB / TDENGINE
      # data    解析后的属性/时序数据，可选 DEFAULT / MONGODB / TDENGINE
      # event   事件/告警数据，可选 DEFAULT / MONGODB / TDENGINE
      # command 指令历史，可选 DEFAULT / MONGODB；若配置 TDENGINE 会自动回落到 DEFAULT
      storage:
        raw: DEFAULT
        data: DEFAULT
        event: DEFAULT
        command: DEFAULT
      # 关闭时即使 storage 配置为 MONGODB 也会自动回落到 DEFAULT
      mongo-enabled: false
      # mongo-uri 未配置时，可复用 spring.data.mongodb.uri
      # mongo-uri: mongodb://127.0.0.1:27017/budiot_device
      # 关闭时即使 storage 配置为 TDENGINE 也会自动回落到 DEFAULT
      tdengine-enabled: false
      # tdengine-url: jdbc:TAOS://127.0.0.1:6030/test

