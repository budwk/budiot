wk:
  dao:
    tenant:
      enabled: false
      ignore-tables: []
    interceptor:
      log:
        enabled: false
      time:
        enabled: false
    sqls:
      path: sqls/
    druid-web:
      enabled: false
      username: admin
      password: admin
  database:
    enabled: true
    snowflake: true
    table:
      create: true
      migration: true
      add: true
      delete: false
      check: false
      package:
        - com.budwk.sp
  device:
    message:
      enabled: true
      provider: REDIS
      topic-prefix: wk.device
      send-timeout: 3000
    gateway:
      node-id: gateway-node-01
      host: 127.0.0.1
      heartbeat-seconds: 10
      sync-seconds: 60
      downlink-topic: wk.device.downlink.command
    network:
      tcp:
        idle-timeout-seconds: 300

spring:
  main:
    allow-circular-references: true
    web-application-type: none
  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        register-enabled: false
  profiles:
    active: @spring.profile@
  application:
    name: wk-device-gateway

server:
  port: 0

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log
