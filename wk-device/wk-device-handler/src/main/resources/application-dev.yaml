spring:
  main:
    allow-circular-references: true
    web-application-type: none
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: et922
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  cloud:
    nacos:
      discovery:
        server-addr: 10.10.10.3:8848
        namespace: dev
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
      config:
        server-addr: 10.10.10.3:8848
        namespace: dev
