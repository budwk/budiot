  rabbitmq:
    host: 10.10.10.3
    port: 15672
    username: admin
    password: admin
  config:
    import:
      - optional:nacos:application-common.yml
      - optional:nacos:${spring.application.name}.yaml?refreshEnabled=true
wk:
  dao:
    tenant:
      enabled: false
      ignore-tables: [ ]
    interceptor:
      log:
        enabled: false
      time:
        enabled: false
    sqls:
      path: sqls/
    druid-web:
      enabled: false
      username: admin
      password: admin
  database:
    enabled: true
    snowflake: true
    table:
      create: true
      migration: true
      add: true
      delete: false
      check: false
      package:
        - com.budwk.sp
  device:
    # 消息队列配置，默认 redis
    message:
      enabled: true
      provider: REDIS
      topic-prefix: wk.device
      send-timeout: 3000
    handler:
      raw-topic: wk.device.uplink.raw
      script-timeout-ms: 1500
      script-refresh-channel: wk:device:protocol:script:refresh

